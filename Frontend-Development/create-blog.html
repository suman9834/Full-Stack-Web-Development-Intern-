<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBlog - Create / Edit Blog</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-slim@2.0.6/tsparticles.slim.bundle.min.js"></script>
</head>
<body>
    <div id="tsparticles"></div>
    <div id="toastContainer" class="toast-container"></div>

    <nav class="navbar glass-card">
        <div class="logo">Dev<span>Blog</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="create-blog.html" class="btn-create active">+ Create Blog</a></li>
        </ul>
    </nav>

    <div class="container" style="max-width: 700px; margin-top: 30px;">
        <div class="glass-card" style="padding: 35px;">
            <h2 id="formTitle" style="font-size: 1.8rem; margin-bottom: 20px; color: #fff;">Create New Article</h2>
            
            <form id="blogForm" style="display: flex; flex-direction: column; gap: 18px;">
                <input type="hidden" id="blogId">

                <div>
                    <label style="color: #cbd5e1; font-size: 0.9rem; display: block; margin-bottom: 6px;">Article Title</label>
                    <input type="text" id="title" placeholder="Enter post title..." required style="width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border); border-radius: 10px; color: #fff; outline: none;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label style="color: #cbd5e1; font-size: 0.9rem; display: block; margin-bottom: 6px;">Author Name</label>
                        <input type="text" id="author" placeholder="Your name" required style="width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border); border-radius: 10px; color: #fff; outline: none;">
                    </div>
                    <div>
                        <label style="color: #cbd5e1; font-size: 0.9rem; display: block; margin-bottom: 6px;">Category</label>
                        <select id="category" style="width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--card-border); border-radius: 10px; color: #fff; outline: none;">
                            <option value="Frontend">Frontend</option>
                            <option value="Backend">Backend</option>
                            <option value="UI/UX">UI/UX</option>
                            <option value="General">General</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label style="color: #cbd5e1; font-size: 0.9rem; display: block; margin-bottom: 6px;">Content</label>
                    <textarea id="content" rows="8" placeholder="Write full content here..." required style="width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border); border-radius: 10px; color: #fff; outline: none; resize: vertical;"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn-create" style="padding: 12px; border: none; cursor: pointer; font-size: 1rem; margin-top: 10px;">Publish Blog</button>
            </form>
        </div>
    </div>

    <script src="create-blog.js"></script>
</body>
</html>
